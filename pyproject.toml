[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walkie"
version = "0.1.0"
description = "Offline-first walking planner with local AI suggestions"
requires-python = ">=3.10"
dependencies = [
    "ollama",
    "requests",
    "astral",
    "osmnx",
    "networkx",
    "gpxpy",
    "osmium",
    "piper-tts",
    "imageio-ffmpeg",
    "plyer",
    "pyyaml",
    "PyQt6",
    "pyobjus; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
walkie = "walkie.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "PLR0913"]

[tool.ruff.lint.pylint]
max-args = 13

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
packages = ["walkie"]
