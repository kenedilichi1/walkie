[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walkie"
version = "0.1.0"
description = "Offline-first calendar-aware walking planner"
requires-python = ">=3.10"
dependencies = [
    "ollama",
    "icalendar",
    "requests",
    "astral",
    "osmnx",
    "networkx",
    "gpxpy",
    "mutagen",
    "librosa",
    "plyer",
    "pyyaml",
    "PyQt6",
]

[project.scripts]
walkie = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
